name: Verify prompt validation
on:
  push:
    branches: [vars-prompt-validation-checks]
permissions:
  contents: read
jobs:
  prompt-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ansible
        run: python -m pip install -e .
      - name: Sanity checks for all changed files
        run: |
          mapfile -t changed < <(git diff --name-only 0d66197543ddbca1a7afa13da1df94bae70dd3ce..HEAD -- lib test changelogs)
          bin/ansible-test sanity --venv --requirements --python 3.13 "${changed[@]}" -v
      - name: Unit tests
        if: always()
        run: >-
          bin/ansible-test units --venv --requirements --python 3.13 -v
          test/units/utils/test_vars_prompt.py test/units/utils/test_display.py
          test/units/utils/display/ test/units/playbook/test_play.py
      - name: Prompt integration tests
        if: always()
        run: bin/ansible-test integration --venv --requirements --python 3.13 -v builtin_vars_prompt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-validation-results
          path: test/results/

